[package]
name = "ignis"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rfd = "0.15"
cpal = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
debug = false
